<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SyntaxMP</title>
    <script>
        (function () {
            var simulatedPath = new URLSearchParams(window.location.search).get("path");
            var actualPath = window.location.pathname === "/404.html"
                ? "/"
                : window.location.pathname + window.location.search;
            var path = simulatedPath || actualPath;
            if (path && path.charAt(0) !== "/") {
                path = "/" + path;
            }
            var target = path && path !== "/" && path !== "/404.html"
                ? "/#/404" + path
                : "/#/404";
            window.location.replace(target);
        }());
    </script>
</head>
<body>
Redirecting to SyntaxMP...
</body>
</html>
