name: Deploy demo

on:
  release:
    types:
      - published

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate stable release version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing to deploy demo for non-stable release tag: $RELEASE_TAG"
            exit 1
          fi

          version="$(grep -E 'version = "[^"]+"' build.gradle.kts | sed -E 's/.*version = "([^"]+)".*/\1/')"
          tag_version="${RELEASE_TAG#v}"

          if [[ -z "$version" ]]; then
            echo "Could not read project version from build.gradle.kts."
            exit 1
          fi

          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Refusing to deploy demo for SNAPSHOT version: $version"
            exit 1
          fi

          if [[ "$tag_version" != "$version" ]]; then
            echo "Release tag $RELEASE_TAG does not match project version $version."
            exit 1
          fi

      - name: Build demo distribution
        run: ./gradlew :syntaxmp-demo:wasmJsBrowserDistribution

      - name: Configure Pages custom domain
        run: echo "demo.syntaxmp.com" > syntaxmp-demo/build/dist/wasmJs/productionExecutable/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: syntaxmp-demo/build/dist/wasmJs/productionExecutable

  deploy:
    if: ${{ github.event.release.prerelease == false }}
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
